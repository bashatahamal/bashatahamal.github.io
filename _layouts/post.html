---
layout: v2
---

<article class="post">
  <div class="container">
    <a class="back" href="{{ site.baseurl }}/writing/">&larr; All writing</a>
    <header>
      <span class="a-kicker">{{ page.date | date: "%B %-d, %Y" }}</span>
      <h1>{{ page.title }}</h1>
    </header>
    <div class="prose post-body">
      {{ content }}
    </div>
    <footer class="post-foot">
      <a class="back" href="{{ site.baseurl }}/writing/">&larr; All writing</a>
    </footer>
  </div>
</article>
