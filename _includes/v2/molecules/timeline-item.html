{% assign job = include.job %}
<li class="m-timeline-item{% if job.current %} m-timeline-item--current{% endif %}">
  <div class="head">
    <h3>{% if job.link %}<a href="{{ site.baseurl }}{{ job.link }}">{{ job.company }}</a>{% else %}{{ job.company }}{% endif %}</h3>
    <span class="role">{{ job.role }}</span>
    <span class="a-kicker">{{ job.period }}{% if job.location %} · {{ job.location }}{% endif %}</span>
  </div>
  <p class="desc">{{ job.summary }}</p>
</li>
