# ---- Site switches (how-to: docs/site-settings.md) ----

# Availability chip in the hero. Change text/tone here, no HTML needed.
# tone: open (green dot) | busy (gold dot) | quiet (neutral text, no dot)
availability:
  show: true
  text: Open to new roles
  tone: open

# Writing section. false = hidden everywhere (homepage section, nav link,
# /writing/ page shows "coming soon"). Flip to true when ready to publish.
show_writing: false

# Hide unfinished work cards without touching the project files. List project
# slugs (the last part of the permalink: projects/berning -> berning).
# Hidden = card gone from the work grid; the detail page still renders at its
# direct URL but gets a noindex meta tag. Example: hidden_projects: [berning]
hidden_projects: []

# ---- Site metadata ----

title: Basha Tahamal
nickname: Basha
fullname: M. Hawatif Basharuddin R. T.
email: bashatahamal@gmail.com
description: "Basha Tahamal, software engineer specializing in AI/LLM systems: LLM applications, agents and RAG pipelines, computer vision, and MLOps."
meta_author: Basha Tahamal

# ---- Build settings ----

baseurl: ""
markdown: kramdown
permalink: pretty
exclude: [README.md, CLAUDE.md, docs, scripts, temp, Dockerfile, docker-compose.yml, Rakefile, Gemfile, Gemfile.lock, LICENSE]

# Blog posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /writing/:title/
